# ==================== 网络与安全配置 ====================
port 6379
# 生产环境如果不需要公网直连，建议绑定内网 IP；如果必须 0.0.0.0，请务必配合防火墙（安全组）限制来源 IP
bind 0.0.0.0

# 生产环境密码必须足够复杂（包含大小写字母、数字、特殊符号），切勿使用 123456
requirepass 123456

# 客户端闲置超时时间（单位：秒）。设置为 300 秒可以自动断开僵尸连接，释放资源
timeout 300

# 如果使用 Docker 部署，daemonize 必须为 no（由容器管理进程）；如果是非容器裸机部署，可设为 yes
daemonize no

# ==================== 日志与基础配置 ====================
loglevel notice
logfile "/logs/redis-server.log"

# 数据库数量（默认 16，通常默认 0 就够用了）
databases 16

# ==================== 持久化配置 (核心安全网) ====================
# 建议开启 AOF，保证数据安全性
appendonly yes
appendfilename "appendonly.aof"

# AOF 刷盘策略：everysec（每秒刷盘一次，兼顾性能与安全性，生产环境标配）
appendfsync everysec

# RDB 快照策略（保留原有高频备份，也可以结合 AOF 一起工作）
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir ./

# ==================== 内存与淘汰策略 (防 OOM 崩溃) ====================
# 【极其重要】必须设置最大内存限制！根据服务器物理内存大小调整（例如 4gb、8gb、2gb）
# 假设服务器有 8G 内存，给 Redis 分配 4G：
maxmemory 4gb

# 内存淘汰策略：当达到 maxmemory 时的处理方式。
# 如果作为纯缓存，推荐使用 volatile-lru 或 allkeys-lru
maxmemory-policy allkeys-lru

# ==================== 慢查询日志配置 ====================
# 记录执行时间超过 5000 微秒（5ms）的请求
slowlog-log-slower-than 5000

# 慢查询日志最多保存 1000 条
slowlog-max-len 1000

# ==================== 客户端连接限制 ====================
# 最大连接客户端数量（防止连接被耗尽）
maxclients 10000
